name: Build APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Unzip Project & Fix Gradlew
      run: |
        ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIPFILE" ]; then
          echo "هیچ فایل زیپی یافت نشد!"
          exit 1
        fi
        echo "در حال اکسترکت: $ZIPFILE"
        unzip -o "$ZIPFILE"

        # اگر فایل‌ها داخل یک پوشه فشرده شده بودند، به ریشه منتقل کن
        if [ ! -f "gradlew" ]; then
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJ_DIR=$(dirname "$GRADLEW_PATH")
            echo "Moving files from $PROJ_DIR..."
            cp -r "$PROJ_DIR"/* .
          fi
        fi

        # حذف کوتیشن‌های خراب -Xmx64m از gradlew به صورت خودکار
        sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS=""/' gradlew
        chmod +x gradlew

    - name: 3. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: 5. Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UniversalPdfReader-APK
        path: app/build/outputs/apk/debug/*.apk
