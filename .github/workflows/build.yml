name: Build APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Unzip Project
        run: |
          # ONLY the exact fixed package — never pick MindPage-Fixed-1.zip or old zips.
          if [ ! -f "MindPage-Fixed.zip" ]; then
            echo "ERROR: MindPage-Fixed.zip not found in repo root."
            echo "Files present:"
            ls -la
            exit 1
          fi
          echo "Extracting: MindPage-Fixed.zip"
          # Remove any leftover project trees from previous runs in same workspace (shouldn't happen on fresh runner)
          unzip -o MindPage-Fixed.zip
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$GRADLE_ROOT" ]; then
              PROJ_DIR=$(dirname "$GRADLE_ROOT")
              echo "Moving files from $PROJ_DIR"
              cp -r "$PROJ_DIR"/* .
            fi
          fi
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          # Sanity: StudyModeScreens must not call LocalStrings inside remember {}
          if grep -n 'remember {[^}]*LocalStrings' app/src/main/java/app/pdfreader/ui/StudyModeScreens.kt; then
            echo "ERROR: illegal LocalStrings use inside remember"
            exit 1
          fi
          echo "Project root OK"
          ls -la

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPdfReader-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
