name: Build APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Unzip Project
        run: |
          # Prefer the fixed package if present; never fall back to an old maxmode zip silently.
          ZIPFILE=""
          for candidate in MindPage-Fixed.zip MindPage-Fixed*.zip *.zip; do
            if [ -f "$candidate" ]; then ZIPFILE="$candidate"; break; fi
          done
          if [ -z "$ZIPFILE" ]; then
            echo "No zip file found! Upload MindPage-Fixed.zip to the repo root."
            ls -la
            exit 1
          fi
          echo "Extracting: $ZIPFILE"
          unzip -o "$ZIPFILE"
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$GRADLE_ROOT" ]; then
              PROJ_DIR=$(dirname "$GRADLE_ROOT")
              echo "Moving files from $PROJ_DIR"
              cp -r "$PROJ_DIR"/* .
            fi
          fi
          # Always use Gradle from setup-gradle (project wrapper may be incomplete on CI).
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Project root OK"
          ls -la

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPdfReader-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
