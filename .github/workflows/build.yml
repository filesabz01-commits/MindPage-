name: Build APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Unzip Project
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIPFILE" ]; then
            echo "No zip file found!"
            exit 1
          fi
          unzip -o "$ZIPFILE"
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$GRADLE_ROOT" ]; then
              PROJ_DIR=$(dirname "$GRADLE_ROOT")
              cp -r "$PROJ_DIR"/* .
            fi
          fi
          rm -f gradle/wrapper/gradle-wrapper.jar

      - name: 3. Patch Code Errors
        run: |
          sed -i 's/package app.pdfreader.ui/package app.pdfreader.ui; import app.pdfreader.ui.l10n.localize;/' app/src/main/java/app/pdfreader/ui/SettingsScreen.kt
          sed -i 's/str.textModelPriorityDesc/"Text Models"/' app/src/main/java/app/pdfreader/ui/SettingsScreen.kt
          sed -i 's/str.ttsModelPriorityDesc/"TTS Priority"/' app/src/main/java/app/pdfreader/ui/SettingsScreen.kt
          sed -i 's/vm::setHideFallbackText/{}/' app/src/main/java/app/pdfreader/ui/SettingsScreen.kt
          sed -i 's/vm::setNightMode/{}/' app/src/main/java/app/pdfreader/ui/SettingsScreen.kt
          sed -i 's/package app.pdfreader.ui/package app.pdfreader.ui; import app.pdfreader.ui.l10n.LocalStrings;/' app/src/main/java/app/pdfreader/ui/StudyModeScreens.kt

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: 6. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 7. Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPdfReader-APK
          path: app/build/outputs/apk/debug/*.apk
