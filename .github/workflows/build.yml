name: Build APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          if [ ! -f "MindPage-Fixed.zip" ]; then
            echo "ERROR: upload exactly MindPage-Fixed.zip (no -1 -2 -3 -4 suffix)."
            ls -la
            exit 1
          fi
          # Refuse numbered variants even if present
          echo "Extracting: MindPage-Fixed.zip"
          unzip -o MindPage-Fixed.zip
          if [ ! -f "settings.gradle.kts" ]; then
            GRADLE_ROOT=$(find . -name "settings.gradle.kts" | head -n 1)
            if [ -n "$GRADLE_ROOT" ]; then
              cp -r "$(dirname "$GRADLE_ROOT")"/* .
            fi
          fi
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Project root OK"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalPdfReader-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
