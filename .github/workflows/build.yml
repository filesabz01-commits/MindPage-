name: Build APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Unzip Project & Clean Corrupt Files
      run: |
        ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIPFILE" ]; then
          echo "هیچ فایل زیپی یافت نشد!"
          exit 1
        fi
        echo "در حال اکسترکت: $ZIPFILE"
        unzip -o "$ZIPFILE"

        # انتقال فایل‌ها به پوشه اصلی در صورت وجود ساب‌فولدر
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$GRADLE_ROOT" ]; then
            PROJ_DIR=$(dirname "$GRADLE_ROOT")
            echo "Moving files from $PROJ_DIR..."
            cp -r "$PROJ_DIR"/* .
          fi
        fi

        # حذف فایل خراب جار برای جلوگیری از تداخل
        rm -f gradle/wrapper/gradle-wrapper.jar

    - name: 3. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 4. Set up Gradle 8.9 (مستقل از فایل جار خراب)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
        validate-wrappers: false

    - name: 5. Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: 6. Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UniversalPdfReader-APK
        path: app/build/outputs/apk/debug/*.apk
